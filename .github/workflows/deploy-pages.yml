name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, mobile-ui ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ts

      # Mark the GitHub Pages build as alpha, with its build time, in the
      # version string (shown in the title bar and About box). Only the
      # checked-out copy is changed.
      - name: Mark version as alpha with build time
        run: |
          BUILT=$(date -u '+%Y-%m-%d %H:%M UTC')
          sed -E -i "s/(versionString: string = \"[^\"]*)\"/\1 (alpha $BUILT)\"/" ts/CirSim.ts
          grep 'versionString: string = ".* (alpha .*)"' ts/CirSim.ts

      - name: Build site
        run: ./dist-offline.sh
        env:
          VITE_DROPBOX_ENABLED: 'false'
          VITE_SHORT_RELAY_SUPPORTED: 'false'
          VITE_SERVICE_WORKER_ENABLED: 'false'
          VITE_MOBILE_EDITOR_ENABLED: 'false'

      - name: Finalize static site
        run: bash ./scripts/finalize-site.sh release

      # site/ has no index.html of its own (the app's entry point is
      # circuitjs.html), so GitHub Pages 404s at the site root without this.
      # Scoped to this workflow only — not added to ts/ or the other build
      # scripts, which don't need it (dist.sh/dist-offline.sh deployments are
      # placed under a path where the caller already knows to link straight
      # to circuitjs.html).
      - name: Add index.html redirect to circuitjs.html
        run: |
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=circuitjs.html">
            <meta name="google-site-verification" content="fdBCLpnP8Gie90YLauInqAV6FggTMN9Wm2Z8hn-AN0Y" />
            <link rel="icon" type="image/svg+xml" href="mobile/icons/page-icon.svg">
            <title>CircuitJS</title>
          </head>
          <body>
            <a href="circuitjs.html">CircuitJS</a>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
