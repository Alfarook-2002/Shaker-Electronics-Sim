  <!-- Multi-wave Liquid Fill (Stops at top using fill="freeze") -->
  <g clip-path="url(#container-and-leads-clip)">
    <g>
      <!-- One-time rise that freezes on completion -->
      <animateTransform attributeName="transform" type="translate" values="0 300; 0 -25" calcMode="spline" keySplines="0.45 0.05 0.55 0.95" dur="6s" fill="freeze" />

      <!-- Solid base rect beneath wave paths -->
      <rect x="-160" y="160" width="840" height="340" fill="#ffe177" />

      <!-- Deep Back Wave (Darker Orange) -->
      <g opacity="0.65">
        <animateTransform attributeName="transform" type="translate" values="0 0; -160 0" dur="2.4s" repeatCount="indefinite" />
        <path fill="#e69d1e" d="M -160,140 C -120,115 -80,165 -40,140 C 0,115 40,165 80,140 C 120,115 160,165 200,140 C 240,115 280,165 320,140 C 360,115 400,165 440,140 C 480,115 520,165 560,140 C 600,115 640,165 680,140 L 680,300 L -160,300 Z" />
      </g>

      <!-- Mid Wave Layer (Primary Yellow-Orange) -->
      <g opacity="0.85">
        <animateTransform attributeName="transform" type="translate" values="-160 0; 0 0" dur="1.7s" repeatCount="indefinite" />
        <path fill="#ffe177" d="M -160,140 C -110,165 -70,115 -20,140 C 30,165 70,115 120,140 C 170,165 210,115 260,140 C 310,165 350,115 400,140 C 450,165 490,115 540,140 C 590,165 630,115 680,140 L 680,300 L -160,300 Z" />
      </g>

      <!-- Front Surface Wave (Bright Accent Yellow) -->
      <g opacity="0.95">
        <animateTransform attributeName="transform" type="translate" values="0 0; -160 0" dur="1.2s" repeatCount="indefinite" />
        <path fill="#ffe177" d="M -160,140 C -125,122 -85,158 -40,140 C 5,122 45,158 90,140 C 135,122 175,158 220,140 C 265,122 305,158 350,140 C 395,122 435,158 480,140 C 525,122 565,158 610,140 C 655,122 695,158 740,140 L 740,300 L -160,300 Z" />
      </g>
    </g>
  </g>

